.0.229/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/serde_json-1.0.151/LICENSE-APACHE":"62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a","licenses/serde_json-1.0.151/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/stockfish-19-lite/Copying.txt":"0b383d5a63da644f628d99c33976ea6487ed89aaa59f0b3257992deac1171e6b","licenses/syn-3.0.4/LICENSE-APACHE":"62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a","licenses/syn-3.0.4/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/unicode-ident-1.0.24/LICENSE-APACHE":"62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a","licenses/unicode-ident-1.0.24/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/unicode-ident-1.0.24/LICENSE-UNICODE":"f7db81051789b729fea528a63ec4c938fdcb93d9d61d97dc8cc2e9df6d47f2a1","licenses/zmij-1.0.23/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","source/esca-wrapper/Cargo.lock":"77a02d592dbfb6dee51fdbc3e00d1bdc2b5efcf5d82a40e7df59a2cc635a7b66","source/esca-wrapper/Cargo.toml":"32323be08f0056f2645e2c5a937d381d8d833d710a80a7736b9b45345cfb65d2","source/esca-wrapper/README.md":"f497ce40e90d751dd7515021098f55dda062423507d0ce629c06b559d059b102","source/esca-wrapper/src/lib.rs":"13a7678add29596e4e9fa527b1256fe41ce485e6c04c15f753b3da41d36faf69"}''')
          root = pathlib.Path.cwd()
          tracked = set(subprocess.check_output(['git','ls-files','-z']).decode().rstrip('\0').split('\0'))
          assert tracked == set(expected) | {'.github/workflows/publish-demo.yml'}, 'Unexpected repository files'
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'alfred-chess-demo-static'
          stage.mkdir()
          for name, sha in expected.items():
              src = root / name
              assert src.is_file() and not src.is_symlink() and src.resolve().is_relative_to(root)
              assert hashlib.sha256(src.read_bytes()).hexdigest() == sha, name
              dst = stage / name
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)
          print(f'Verified {len(expected)} allowlisted public assets')
          PY
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/alfred-chess-demo-static
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
