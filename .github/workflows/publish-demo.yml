# Initial publication only. No build, inference, private data or repository secrets.
# Do not merge/run without the owner's explicit Pages-only hosted-runner exception.
name: Publish Alfred Chess demo
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-demo.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: alfred-chess-demo-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Dmitry-dev-pet/alfred-chess-demo' && github.actor == 'Dmitry-dev-pet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public demo only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact public assets and stage without workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          expected = json.loads(r'''{".nojekyll":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","README.md":"44effb85bc7a5d5ee4c33448c0e292a18d6a8195a6a9cbef756a3ab13f2f27be","app.mjs":"9c10c5303c6a666e77c79fb1640978263614b71d6b330183e0b05d06d87ecfdd","chess.mjs":"631f21a8fcd3c11f6df7bc3b91ade2795bcb13f296d8047ba393d8d0a8993d47","credits.html":"22a8d0ff26a32d2bd48cfe94b1bfec4640edb3a11ea15de032415d59026de4b4","engine/esca.wasm.gz":"5358298a211b20859ceb7b287e43a45ddb33fae6d59253652bd2c1c1e5843821","engine/stockfish-19-lite-single.js":"d3344124ab067fb0b90ee77873bb8e9fbf5fc01bc525fe714b0f942581e889e6","engine/stockfish-19-lite-single.wasm":"57ac2d72312aba346760e3f173f687a8c211208e97a87268436f7f0e10bb5387","index.html":"330dbb7d78e5bc2aee6774b6551b8dc679a67def6a085f4510b850d340d3d0b7","licenses/cozy-chess/LICENSE":"e2e583de8c230aec253c6e83f312171f7d76f122caf9477ed2c8f42b7371f446","licenses/esca-0.4.0/LICENSE":"1d9b07ead9c4aa3b803251c25537335d06eaad32a85ea78887dda2663e4a2f11","licenses/itoa-1.0.18/LICENSE-APACHE":"62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a","licenses/itoa-1.0.18/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/memchr-2.8.3/COPYING":"01c266bced4a434da0051174d6bee16a4c82cf634e2679b6155d40d75012390f","licenses/memchr-2.8.3/LICENSE-MIT":"0f96a83840e146e43c0ec96a22ec1f392e0680e6c1226e6f3ba87e0740af850f","licenses/memchr-2.8.3/UNLICENSE":"7e12e5df4bae12cb21581ba157ced20e1986a0508dd10d0e8a4ab9a4cf94e85c","licenses/proc-macro2-1.0.107/LICENSE-APACHE":"62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a","licenses/proc-macro2-1.0.107/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/quote-1.0.47/LICENSE-APACHE":"62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a","licenses/quote-1.0.47/LICENSE-MIT":"23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3","licenses/rust-1.93.0/COPYRIGHT-library.html":"d93d6