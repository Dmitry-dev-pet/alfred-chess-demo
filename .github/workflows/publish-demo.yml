# Exact reviewed publication payload. No build, inference, private data or secrets.
# The initial one-time hosted-runner exception has been consumed.
# Each new release requires a new explicit owner exception before merging/running.
name: Publish Alfred Chess demo
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/publish-demo.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: alfred-chess-demo-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Dmitry-dev-pet/alfred-chess-demo' && github.actor == 'Dmitry-dev-pet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public demo only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
